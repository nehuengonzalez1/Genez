<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Genez · Sistema de gestión</title>
    <script>
      // Una ruta del propio sitio, no la API de Anthropic: la atiende
      // api/anthropic.js, que es donde vive la credencial. En desarrollo la
      // sirve el middleware de vite.config.js y en producción el rewrite de
      // vercel.json, pero es el mismo archivo en los dos.
      window.__API_BASE__ = "/api/anthropic";
      window.__API_MODELO__ = "claude-sonnet-5";

      // genez.com.ar muestra la landing; el sistema se entra por /login.
      // Salvo en la compu que ya tiene la sesión iniciada: la caja de un
      // comercio abre genez.com.ar (es la app que tiene instalada) y no
      // puede caer en la landing en medio de una venta. Tampoco se desvía
      // la vuelta del correo de "olvidé mi clave", que llega a / con el
      // token en la dirección y todavía sin sesión guardada. Solo en el
      // dominio de producción: en desarrollo y en las vistas previas de
      // Vercel la raíz sigue siendo el sistema.
      (function () {
        if (!/^(www\.)?genez\.com\.ar$/.test(location.hostname) || location.pathname !== "/") return;
        if (/access_token|type=recovery|error_description/.test(location.hash) || /[?&](code|token_hash)=/.test(location.search)) return;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.+-auth-token$/.test(localStorage.key(i))) return;
          }
        } catch (e) { /* sin localStorage no hay sesión guardada */ }
        location.replace("/landing");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
