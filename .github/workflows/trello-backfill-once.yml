name: Backfill puntual de Trello (Sprint 8/9 + En develop)

# Uso único: arregla las tarjetas que quedaron mal ubicadas porque el
# workflow trello-sync.yml no conocía Sprint 8 ni Sprint 9 (issue #59).
# Se dispara a mano (workflow_dispatch) y se borra después de correrlo.
#
# Con jq y no con Python embebido: un bloque de Python sin indentar
# dentro de un `run: |` corta el bloque y GitHub rechaza el archivo
# entero (el mismo bug que ya tuvo trello-sync.yml una vez). jq en una
# sola línea no tiene ese riesgo.

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver listas, crear Sprint 9 si falta, y mover tarjetas
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: |
          set -e
          AUTH="key=${TRELLO_KEY}&token=${TRELLO_TOKEN}"
          BOARD_ID=6aa4811ea3c3ffb09cedcaa5

          LISTS_JSON=$(curl -sf "https://api.trello.com/1/boards/${BOARD_ID}/lists?${AUTH}")
          echo "$LISTS_JSON" | jq -r '.[] | "\(.id) | \(.name)"'

          find_list() { echo "$LISTS_JSON" | jq -r --arg n "$1" '[.[] | select(.name | contains($n))][0].id // empty'; }

          SPRINT8_ID=$(find_list "Sprint 8")
          DEVELOP_ID=$(find_list "En develop")
          SPRINT9_ID=$(find_list "Sprint 9")

          echo "Antes: Sprint8=$SPRINT8_ID Develop=$DEVELOP_ID Sprint9=$SPRINT9_ID"

          if [ -z "$SPRINT9_ID" ]; then
            NAME_ENC=$(jq -rn --arg n "Sprint 9 — Nuevos módulos comerciales" '$n|@uri')
            SPRINT9_ID=$(curl -sf -X POST "https://api.trello.com/1/lists?name=${NAME_ENC}&idBoard=${BOARD_ID}&pos=bottom&${AUTH}" | jq -r '.id')
            echo "Creada lista Sprint 9: $SPRINT9_ID"
          fi

          echo "IDS_RESUELTOS sprint8=$SPRINT8_ID develop=$DEVELOP_ID sprint9=$SPRINT9_ID"

          CARDS_JSON=$(curl -sf "https://api.trello.com/1/boards/${BOARD_ID}/cards?fields=name,id,idList&${AUTH}")

          move_issue() {
            local num="$1" target="$2" cid
            cid=$(echo "$CARDS_JSON" | jq -r --arg p "#$num " '[.[] | select(.name | startswith($p))][0].id // empty')
            if [ -z "$cid" ]; then echo "#$num: tarjeta no encontrada"; return; fi
            curl -sf -X PUT "https://api.trello.com/1/cards/${cid}?idList=${target}&${AUTH}" > /dev/null
            echo "#$num -> lista $target (card $cid) OK"
          }

          for n in 55 57 58 59; do move_issue "$n" "$SPRINT8_ID"; done
          for n in 52 53 54 56 65 67; do move_issue "$n" "$DEVELOP_ID"; done
          for n in 71 72 73 74 77 78; do move_issue "$n" "$SPRINT9_ID"; done

          echo "FINAL_IDS sprint8=$SPRINT8_ID develop=$DEVELOP_ID sprint9=$SPRINT9_ID"
