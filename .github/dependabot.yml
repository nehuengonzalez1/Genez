# Dependabot revisa las dependencias una vez por semana. Los parches y
# versiones menores llegan agrupados en un solo PR para no llenar la lista;
# una versión mayor viene sola, porque se mira a mano.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    commit-message:
      prefix: "chore(ci)"
